services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5432:5432"
    volumes:
      - payment_service_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payment_service_pgdata:
