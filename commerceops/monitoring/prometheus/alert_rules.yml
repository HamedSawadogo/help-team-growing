groups:
  - name: commerceops-alerts
    rules:
      - alert: HighHttpErrorRate
        # Threshold is deliberately simple (5xx ratio over 5m) - tune to
        # your traffic volume before trusting it in anger.
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count[5m]))
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate above 5%"
          description: "More than 5% of requests have returned a 5xx status over the last 5 minutes."

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 HTTP latency above 2s"
          description: "95th percentile request latency has exceeded 2 seconds for 5 minutes."

      - alert: HikariPoolSaturation
        expr: hikaricp_connections_pending > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Threads waiting for a DB connection"
          description: "hikaricp_connections_pending has been above 0 for a minute - the pool is undersized for current load, or something is holding connections too long."

      - alert: HikariPoolNearlyExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP pool over 90% utilized"
          description: "Active connections are consistently above 90% of the configured max pool size."

      - alert: RisingPendingPayments
        expr: commerceops_payments_pending > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Payments stuck in PENDING"
          description: "More than 5 payments have been in PENDING state for over 2 minutes - a sign the provider call or the surrounding transaction is stalling."

      - alert: RepeatedPaymentFailures
        expr: |
          sum(rate(commerceops_payments_outcome_total{result="failed"}[5m]))
            /
          sum(rate(commerceops_payments_outcome_total[5m]))
          > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Payment failure rate above 20%"
          description: "More than 20% of payment attempts have failed over the last 5 minutes - check PAYMENT_FAILURE_RATE and the provider simulator, or an actual regression."
