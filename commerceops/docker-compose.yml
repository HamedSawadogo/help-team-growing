name: commerceops

networks:
  commerceops-net:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

services:
  postgres:
    image: postgres:16.4
    container_name: commerceops-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-commerceops}
      POSTGRES_USER: ${DB_USER:-commerceops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-commerceops}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-commerceops} -d ${DB_NAME:-commerceops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - commerceops-net

  backend:
    build:
      context: ./backend
    container_name: commerceops-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-commerceops}
      DB_USER: ${DB_USER:-commerceops}
      DB_PASSWORD: ${DB_PASSWORD:-commerceops}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_PROFILE: ${SEED_PROFILE:-MEDIUM}
      PAYMENT_LATENCY_MS: ${PAYMENT_LATENCY_MS:-150}
      PAYMENT_JITTER_MS: ${PAYMENT_JITTER_MS:-100}
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.03}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - commerceops-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: commerceops-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - commerceops-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: commerceops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - commerceops-net
