server:
  port: 8080

spring:
  application:
    name: commerceops-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:commerceops}
    username: ${DB_USER:commerceops}
    password: ${DB_PASSWORD:commerceops}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin}

#resilience4j

resilience4j:
  circuitbreaker:
    instances:
      backend:
        # Type de fenêtre pour le calcul du taux d'échec (COUNT_BASED ou TIME_BASED)
        slidingWindowType: COUNT_BASED
        # Nombre d'appels à analyser pour décider du changement d'état
        slidingWindowSize: 10
        # Nombre minimum d'appels requis avant de pouvoir calculer le taux d'échec
        minimumNumberOfCalls: 5
        # Seuil d'échec en pourcentage (ex: 50% d'échecs = ouverture du circuit)
        failureRateThreshold: 50
        # Temps (en secondes) pendant lequel le circuit reste OUVERT avant de passer à DEMI-OUVERT
        waitDurationInOpenState: 10s
        # Nombre d'appels autorisés en état DEMI-OUVERT pour tester la santé du service distant
        permittedNumberOfCallsInHalfOpenState: 3
        # Permet de passer automatiquement de OUVERT à DEMI-OUVERT sans attendre un nouvel appel
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: commerceops-backend
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

commerceops:
  seed:
    enabled: ${SEED_ENABLED:false}
    profile: ${SEED_PROFILE:SMALL}
  payments:
    provider:
      base-latency-ms: ${PAYMENT_LATENCY_MS:150}
      jitter-ms: ${PAYMENT_JITTER_MS:100}
      failure-rate: ${PAYMENT_FAILURE_RATE:0.03}
  executors:
    payment-pool-size: ${PAYMENT_POOL_SIZE:2}
    payment-queue-capacity: ${PAYMENT_QUEUE_CAPACITY:50}

logging:
  level:
    com.commerceops: INFO
